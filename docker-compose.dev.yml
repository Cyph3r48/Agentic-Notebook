# For developers: live reload for the backend and the frontend.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# The default docker-compose.yml runs the small, built versions instead.
services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
      - ./logs:/app/logs

  frontend:
    build:
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
