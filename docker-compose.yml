services:
  # ============================================
  # STRUCTURED INTELLIGENCE CORE SERVICES
  # ============================================
  
  # PostgreSQL - Primary structured data store (SMC compatible)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: si-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-structured_intelligence}
      POSTGRES_USER: ${PGUSER:-si_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - si_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-si_user} -d ${PGDATABASE:-structured_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector database for semantic search (SMC compatible)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: si-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - si_net
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TEI - Text Embeddings Inference (SMC compatible)
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: si-tei
    command: --model-id BAAI/bge-large-en-v1.5 --revision main
    volumes:
      - tei_data:/data
    networks:
      - si_net
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Session management & caching
  redis:
    image: redis:7-alpine
    container_name: si-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_too}
    volumes:
      - redis_data:/data
    networks:
      - si_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  # Backend API - FastAPI with SMC integration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: si-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-si_user}:${PGPASSWORD:-change_me_in_production}@postgres:5432/${PGDATABASE:-structured_intelligence}
      
      # Vector DB
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: si_documents
      
      # Embeddings
      EMBEDDING_URL: http://tei:80
      EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
      EMBEDDING_DIM: 1024
      VECTOR_INDEXING_ENABLED: ${VECTOR_INDEXING_ENABLED:-false}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_too}@redis:6379/0
      
      # LLM Configuration
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.2:3b-instruct-q4_K_M}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_SONNET_MODEL: ${CLAUDE_SONNET_MODEL:-claude-sonnet-4.6}
      CLAUDE_OPUS_MODEL: ${CLAUDE_OPUS_MODEL:-claude-opus-4.6}
      
      # Auth
      JWT_SECRET: ${JWT_SECRET:-generate_secure_secret_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      
      # App Config
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTO_RUN_MIGRATIONS: ${AUTO_RUN_MIGRATIONS:-false}
      
      # SMC Integration
      SMC_ENABLED: ${SMC_ENABLED:-true}
      SMC_ADMIN_TOKEN: ${SMC_ADMIN_TOKEN:-}
      SMC_AUDIT_ENABLED: ${SMC_AUDIT_ENABLED:-true}
      
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
      - ./logs:/app/logs
    networks:
      - si_net
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - React with Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: si-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_NAME: "Structured Intelligence"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - si_net
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx - Reverse proxy & SSL termination (production)
  nginx:
    image: nginx:alpine
    container_name: si-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - si_net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    profiles:
      - production

networks:
  si_net:
    driver: bridge
    name: structured_intelligence_net

volumes:
  postgres_data:
    name: si_postgres_data
  qdrant_data:
    name: si_qdrant_data
  tei_data:
    name: si_tei_data
  redis_data:
    name: si_redis_data
  upload_data:
    name: si_upload_data
