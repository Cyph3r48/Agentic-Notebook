# Lowest memory: keyword search only, no embedding service and no vector database
# (roughly 0.5 GB for the whole stack). Documents are still uploaded, cited and chatted with.
#   docker compose -f docker-compose.yml -f docker-compose.lite.yml up -d --build
# Add the embedding service and Qdrant later by starting without this file, then re-index in Settings > Memory.
services:
  tei:
    profiles: ["off"]
  qdrant:
    profiles: ["off"]
  backend:
    environment:
      VECTOR_INDEXING_ENABLED: "false"
